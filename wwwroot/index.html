<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quality Audit — QA 343-34</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f5; --panel:#fff; --ink:#16202e; --muted:#647084; --faint:#8b97a8;
  --line:#dbe1ea; --steel:#1c3d5a; --steel2:#24506f; --blue:#2f6f9f;
  --green:#15803d; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fdeecb;
  --red:#b91c1c; --red-bg:#fde4e4; --grey:#64748b; --grey-bg:#eef1f5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:var(--steel);color:#fff;flex-wrap:wrap;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;flex-direction:column;gap:3px}
.mark span{width:26px;height:6px;border-radius:1px;display:block}
.ttl{font-weight:700;font-size:16px}
.sub{font-size:11.5px;color:#b7c6d6;margin-top:1px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:9px}
.tabs button{border:0;background:transparent;color:#cdd8e4;font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--steel)}

.pane{max-width:1120px;margin:0 auto;padding:20px 18px 130px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(20,30,45,.04)}
.hidden{display:none !important}
h3{margin:0 0 10px;font-size:14px;font-weight:700}
.muted{color:var(--muted)}

.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;color:var(--ink);width:100%}
.field textarea{resize:vertical}
.readonly-val{font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#f4f7fb;white-space:pre-wrap;min-height:20px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--amber-bg);border:1px solid #eacb8a;color:#7c4a06;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.banner .b-actions{display:flex;gap:8px;flex-shrink:0}
.banner button{border:1px solid #d8b477;background:#fff;color:#7c4a06;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer}
.inline-err{background:var(--red-bg);border:1px solid #e7a3a3;color:var(--red);padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13.5px;font-weight:600}

.head-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.2fr;gap:12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.leg{flex:1;min-width:210px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;border-left-width:5px}
.leg .leg-hd{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.leg .leg-freq{font-size:11px;color:var(--muted);font-weight:600}
.leg .leg-ins{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer}
.chip.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.chip-div{width:1px;height:20px;background:var(--line);margin:0 4px}
.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
.ghost:hover{background:#f4f7fb}
.ghost.danger{color:var(--red);border-color:#f0c9c9}
.primary{border:0;background:var(--steel);color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:8px;cursor:pointer}
.primary:hover{background:var(--steel2)}
.primary:disabled{opacity:.4;cursor:not-allowed}

.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.row.state-nok{border-color:#e7a3a3;background:#fffafa}
.row.state-todo{background:#fcfdfe}
.row.invalid{border-color:var(--red);box-shadow:0 0 0 2px var(--red-bg)}
.spine{width:6px;flex-shrink:0}
.row-main{display:flex;align-items:center;gap:12px;padding:11px 14px;flex:1;min-width:0}
.row-id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--faint);width:28px;text-align:right;flex-shrink:0}
.row-name{flex:1;min-width:0}
.nm{font-size:14.5px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xx{font-size:10px;font-weight:800;color:#fff;background:var(--red);border-radius:4px;padding:1px 5px}
.meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;color:#fff}
.pill.grey{color:var(--muted);background:var(--grey-bg)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f4f7fb;flex-shrink:0}
.seg-btn{border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg-md .seg-btn{font-size:12.5px;padding:9px 13px}
.seg-sm .seg-btn{font-size:11px;padding:6px 10px}
.seg-btn:last-child{border-right:0}
.seg-btn.on{color:#fff}
.seg-btn.ro{cursor:default}
.disc{width:32px;height:32px;flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1}
.disc.on{background:var(--steel);color:#fff;border-color:var(--steel)}

.row-detail{width:100%;padding:8px 16px 16px 54px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:12px;margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sub-checks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.subfield{display:flex;flex-direction:column;gap:6px}
.subfield>span{font-size:11px;font-weight:600;color:var(--muted)}
.cp-list{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfe}
.cp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cp-lbl{font-size:12.5px;font-weight:600}
.cp-lbl em{font-style:normal;color:var(--blue);font-size:11px;font-weight:700;margin-left:6px}
.ins-note{font-size:12px;color:var(--muted);background:#f4f7fb;border-radius:8px;padding:8px 10px;line-height:1.4}
.req-flag{font-size:11px;color:var(--red);font-weight:700}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.addphoto{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--steel);cursor:pointer;background:#fff}
.ro-detail{width:100%;padding:0 14px 12px 54px;display:flex;flex-direction:column;gap:6px}
.ro-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--grey-bg);border-radius:5px;padding:3px 8px}
.tag.act{color:var(--steel);background:#e3edf5}
.tag.warn{color:var(--red);background:var(--red-bg)}
.other-card{margin-top:14px}
.clean,.list-empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

.footbar{position:fixed;bottom:0;left:0;right:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 -2px 10px rgba(20,30,45,.05)}
.progress{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.pbar{flex:1;max-width:320px;height:8px;background:#e6ebf1;border-radius:20px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--blue);border-radius:20px;transition:width .2s}
.pnum{font-size:13px;color:var(--muted);white-space:nowrap}
.pnum strong{color:var(--ink);font-size:15px}
.fail-count{color:var(--red);font-weight:700;margin-left:10px}
.foot-actions{display:flex;gap:8px}

.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}

.confirm{max-width:520px;margin:26px auto;text-align:center}
.confirm .tick{width:64px;height:64px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px;font-weight:800}
.confirm h2{margin:0 0 6px;font-size:22px}
.confirm .c-meta{color:var(--muted);font-size:14px}
.c-stats{display:flex;gap:10px;justify-content:center;margin:18px 0 22px;flex-wrap:wrap}
.c-pill{font-weight:700;border-radius:8px;padding:8px 14px;font-size:14px}
.c-pill.ok{background:var(--green-bg);color:var(--green)}
.c-pill.bad{background:var(--red-bg);color:var(--red)}
.c-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.dept-choose{display:flex;flex-direction:column;gap:12px;max-width:520px;margin:30px auto;text-align:center}
.dept-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.dept-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:20px 28px;font-size:16px;font-weight:700;cursor:pointer;min-width:180px}
.dept-btn:hover{border-color:var(--steel);background:#f4f7fb}
.dept-btn .dref{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}

.selrow{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.selrow .field{gap:3px}.selrow .field>span{font-size:10px}
.selrow .field input,.selrow .field select{padding:7px 9px;font-size:13px}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi-val{font-size:30px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.kpi-lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi-delta{font-size:11.5px;font-weight:700;margin-top:4px}
.kpi.red .kpi-val{color:var(--red)} .kpi.green .kpi-val{color:var(--green)}
.up{color:var(--green)} .down{color:var(--red)}

.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.chart-wrap{position:relative;height:190px}
.card-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:8px}
.hd-note{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}

.comp-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.comp-row:last-child{border-bottom:0}
.comp-name{font-weight:600;display:flex;align-items:center;gap:8px}
.comp-target{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.comp-target.under{color:var(--red)} .comp-target.met{color:var(--green)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.fail-list{display:flex;flex-direction:column;gap:9px}
.fail{display:flex;gap:11px;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fffafa}
.sev-tag{flex-shrink:0;font-size:10.5px;font-weight:800;color:#fff;border-radius:6px;padding:5px 8px;height:fit-content}
.fail-body{flex:1;min-width:0}
.fail-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fail-name{font-weight:700;font-size:14px}
.fail-when{font-size:11.5px;color:var(--faint);white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
.fail-dev{font-size:13px;color:var(--muted);margin:3px 0 7px}
.fail-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar-lbl{width:130px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.bar-lbl em{font-style:normal;font-size:11px;color:var(--faint);font-weight:500}
.bar-track{flex:1;height:9px;background:#e9edf3;border-radius:20px;overflow:hidden}
.bar-track span{display:block;height:100%;border-radius:20px}
.bar-val{width:52px;text-align:right;font-size:13px;font-weight:700;font-family:ui-monospace,Menlo,monospace}

.hist-table{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:120px 80px 1fr 80px 90px 70px;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.hist-row:hover{background:#f4f7fb}
.hist-row.hist-head{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);cursor:default}
.hist-row.hist-head:hover{background:transparent}
.hist-row .h-date{font-weight:700}
.hist-row .good{color:var(--green);font-weight:700}.hist-row .bad{color:var(--red);font-weight:700}
.badge-draft{font-size:10px;font-weight:800;color:var(--amber);background:var(--amber-bg);border-radius:4px;padding:2px 6px}
.back-link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:13px;padding:0;margin-bottom:12px}
.detail-head{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;margin:4px 0 14px}
.detail-head h2{margin:0;font-size:20px}

.admin-sec{margin-bottom:18px}
.adm-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.adm-sev-btns{display:inline-flex;gap:4px}
.rag{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--muted)}
.rag.on{color:#fff;border-color:transparent}
.changed{font-size:11px;color:var(--amber);font-weight:700;margin-left:6px}
.adm-grid{display:grid;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.adm-grid input,.adm-grid select{padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe;width:100%}
.sm-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.sm-btn.danger{color:var(--red);border-color:#f0c9c9}
.retired{opacity:.5}
.adm-lock{text-align:center;padding:40px 20px;color:var(--muted)}

body.tv .top .tabs, body.tv .selrow .field, body.tv #dash-tvbtn{display:none}
body.tv .kpi-val{font-size:52px}.body.tv .kpi-lbl{font-size:16px}
body.tv .chart-wrap{height:280px}
body.tv .pane{max-width:1600px}

@media (max-width:820px){
  .head-grid{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .detail-grid,.sub-checks{grid-template-columns:1fr}
  .row-detail,.ro-detail{padding-left:16px}
  .row-main{flex-wrap:wrap}
  .seg-md{order:3;width:100%}.seg-md .seg-btn{flex:1;text-align:center}
  .hist-row{grid-template-columns:1fr auto auto}.hist-row .h-auditor,.hist-row .h-checked{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><span style="background:#c8102e"></span><span style="background:#2f6f9f"></span><span style="background:#15803d"></span></div>
    <div><div class="ttl">Quality Audit</div><div class="sub">QA 343-34 &middot; weekly RAG line check &amp; dashboard</div></div>
  </div>
  <nav class="tabs">
    <button id="tab-entry" class="on" onclick="showView('entry')">New Audit</button>
    <button id="tab-dash" onclick="showView('dashboard')">Dashboard</button>
    <button id="tab-history" onclick="showView('history')">History</button>
    <button id="tab-admin" onclick="showView('admin')">Admin</button>
  </nav>
</header>

<!-- ===================== NEW AUDIT ===================== -->
<main id="view-entry" class="pane">
  <div id="dept-choose" class="dept-choose">
    <h2>Which area are you auditing?</h2>
    <div id="dept-btns" class="dept-btns"><div class="muted">Loading departments…</div></div>
  </div>

  <div id="entry-main" class="hidden">
    <div id="draft-banner" class="banner hidden"></div>
    <div id="resume-banner" class="banner hidden"></div>
    <div id="entry-error" class="inline-err hidden"></div>

    <section class="card head-card">
      <div class="head-grid">
        <label class="field"><span>Department</span>
          <div style="display:flex;gap:8px;align-items:center"><input id="h-dept" readonly style="background:#eef1f5;font-weight:700" /><button class="ghost" onclick="changeDepartment()">Change</button></div>
        </label>
        <label class="field"><span>Date</span><input id="h-date" type="date" onchange="onDateShiftChange()" /></label>
        <label class="field"><span>Shift</span><select id="h-shift" onchange="onDateShiftChange()"><option>Early</option><option>Late</option><option>Nights</option></select></label>
        <label class="field"><span>Auditor</span><select id="h-auditor"></select></label>
        <label class="field"><span id="arealine-lbl">Area / Line</span><input id="h-arealine" /></label>
      </div>
      <div id="sev-legend" class="legend"></div>
    </section>

    <div class="toolbar">
      <div class="chips" id="filter-chips">
        <button class="chip on" data-sev="all">All levels</button>
        <button class="chip" data-sev="3">Red</button><button class="chip" data-sev="2">Amber</button><button class="chip" data-sev="1">Green</button>
        <span class="chip-div"></span>
        <button class="chip on" data-loc="all">All areas</button>
        <button class="chip" data-loc="Ph1">Ph1</button><button class="chip" data-loc="Ph3">Ph3</button>
        <span class="chip-div"></span>
        <button class="chip on" data-flag="all">Everything</button><button class="chip" data-flag="todo">Not checked</button><button class="chip" data-flag="nok">Failures</button>
      </div>
      <button class="ghost" onclick="markShownOK()">Mark shown OK</button>
    </div>

    <section class="rows" id="rows"></section>

    <section class="card other-card"><label class="field"><span>Other daily issues &amp; tasks</span><textarea id="h-other" rows="2" placeholder="Free notes for the shift"></textarea></label></section>
  </div>
</main>

<div id="footbar" class="footbar hidden">
  <div class="progress"><div class="pbar"><span id="pbar-fill" style="width:0%"></span></div>
    <div class="pnum"><strong id="checked-count">0</strong>/<span id="total-count">0</span> checked<span id="fail-count" class="fail-count hidden"></span></div>
  </div>
  <div class="foot-actions">
    <button class="ghost" onclick="resetEntry()">Reset</button>
    <button class="ghost" onclick="saveAudit(false)">Save draft</button>
    <button id="save-btn" class="primary" onclick="saveAudit(true)" disabled>Save &amp; submit</button>
  </div>
</div>

<!-- ===================== CONFIRM ===================== -->
<main id="view-confirm" class="pane hidden"><div id="confirm-body"></div></main>

<!-- ===================== DASHBOARD ===================== -->
<main id="view-dashboard" class="pane hidden">
  <div class="selrow">
    <label class="field"><span>Department</span><select id="d-dept" onchange="loadDashboard()"></select></label>
    <label class="field"><span>Week of (any day)</span><input id="d-week" type="date" onchange="loadDashboard()" /></label>
    <button class="ghost" onclick="loadDashboard()">Refresh</button>
    <button id="dash-tvbtn" class="ghost" onclick="toggleTv()">Wall display</button>
  </div>
  <div id="dash-body"></div>
</main>

<!-- ===================== HISTORY ===================== -->
<main id="view-history" class="pane hidden">
  <div class="selrow">
    <label class="field"><span>Department</span><select id="hist-dept"></select></label>
    <label class="field"><span>From</span><input id="hist-from" type="date" /></label>
    <label class="field"><span>To</span><input id="hist-to" type="date" /></label>
    <button class="ghost" onclick="loadHistory()">Apply</button>
    <button class="ghost" onclick="showOverview()">12-month overview</button>
  </div>
  <section class="card"><div id="history-body"></div></section>
</main>
<main id="view-history-detail" class="pane hidden"><div id="history-detail-body"></div></main>
<main id="view-overview" class="pane hidden">
  <button class="back-link" onclick="showView('history')">&larr; Back to history</button>
  <section class="card"><div class="card-hd"><h3>12-month pass / fail trend</h3></div><div class="chart-wrap" style="height:300px"><canvas id="ovChart"></canvas></div></section>
</main>

<!-- ===================== ADMIN ===================== -->
<main id="view-admin" class="pane hidden">
  <section class="card admin-sec">
    <div class="selrow" style="margin-bottom:0">
      <label class="field"><span>Signed in as</span><select id="adm-user" onchange="onAdminUserChange()"></select></label>
      <span class="muted" style="font-size:12px">Admin actions run as this person. No auth yet — enforced against AuditUsers.IsAdmin.</span>
    </div>
  </section>
  <div id="admin-tools"></div>
</main>

<script>
// ==========================================================================
// Helpers + constants
// ==========================================================================
const RESULTS = [
  ['OK','OK','#15803d','Acceptable. Product/process meets and conforms to standard. No non-conformity found.'],
  ['NOT_OK','Not OK','#b91c1c','Not acceptable. Product/process has deviations from standard.'],
  ['NOT_AUDITED','Not Audited','#64748b','Not audited. A reason is required.']
];
const RAG = { 1:{name:'Green',hex:'#15803d'}, 2:{name:'Amber',hex:'#b45309'}, 3:{name:'Red',hex:'#b91c1c'} };
const todayISO = () => new Date().toISOString().slice(0,10);
const daysAgoISO = n => new Date(Date.now()-n*86400000).toISOString().slice(0,10);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = id => document.getElementById(id).value;
const setVal = (id,v)=>{ document.getElementById(id).value=(v==null?'':v); };
// Mirror of dbo.fn_WeekStarting (Tuesday weeks) for the dashboard/admin pickers.
function weekStartingISO(iso){ const anchor=Date.UTC(1900,0,2); const d=Date.parse((iso||todayISO())+'T00:00:00Z'); const days=Math.floor((d-anchor)/86400000); const wk=Math.floor(days/7)*7; return new Date(anchor+wk*86400000).toISOString().slice(0,10); }
function nextTuesdayISO(){ const d=Date.parse(weekStartingISO(todayISO())+'T00:00:00Z')+7*86400000; return new Date(d).toISOString().slice(0,10); }

async function api(path, opts){
  opts = opts || {};
  const res = await fetch(path, opts);
  if(!res.ok){ let msg='HTTP '+res.status; try{ const t=await res.text(); if(t){ try{ const j=JSON.parse(t); msg=j.error||j.title||t; }catch(_){ msg=t; } } }catch(_){}
    throw new Error(msg); }
  return res.status===204 ? null : res.json();
}
const adminHeaders = () => adminUser ? { 'X-Username': adminUser } : {};
function adminApi(path, method, body){ return api(path,{ method:method||'GET', headers:Object.assign({'Content-Type':'application/json'},adminHeaders()), body:body!=null?JSON.stringify(body):undefined }); }
function toast(msg,isErr){ const t=document.createElement('div'); t.className='toast'+(isErr?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3400); }

// ==========================================================================
// State
// ==========================================================================
let DEPARTMENTS=[], USERS=[], FORM=null, SEVLEVELS={}, MACHINES=[], CHECKPOINTS=[];
let rows={}, filter={sev:'all',loc:'all',flag:'all'}, expanded=null;
let currentView='entry', lastSaved=null, submissionId=null;
let pendingDraft=null, draftDismissed=false, draftTimer=null, adminUser='';
const DRAFT_KEY='qa-draft-v3';

const emptyRow=()=>({result:'',plans:'',ndt:'',areaDocs:'',notAuditedReasonId:'',partNo:'',deviation:'',customerId:'',actionTypeId:'',actionDetail:'',checkPoints:{},resultId:null,attachments:[]});
const machineById=id=>MACHINES.find(m=>m.id===id);
const sevInfo=s=>SEVLEVELS[s]||{name:(RAG[s]||{}).name||('Sev '+s),colourHex:(RAG[s]||{}).hex||'#64748b',frequencyLabel:'',auditName:'',instruction:''};
const isAudited=r=>r&&r.result!=='';
const anyNok=r=>r&&(r.result==='NOT_OK'||r.plans==='NOT_OK'||r.ndt==='NOT_OK'||r.areaDocs==='NOT_OK');
const rowState=r=>anyNok(r)?'nok':isAudited(r)?'ok':'todo';

// ==========================================================================
// View switching
// ==========================================================================
const PANES={entry:'view-entry',confirm:'view-confirm',dashboard:'view-dashboard',history:'view-history',historyDetail:'view-history-detail',overview:'view-overview',admin:'view-admin'};
function showView(v){
  currentView=v;
  Object.values(PANES).forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById(PANES[v]).classList.remove('hidden');
  document.getElementById('footbar').classList.toggle('hidden', !(v==='entry'&&FORM));
  document.getElementById('tab-entry').classList.toggle('on', v==='entry'||v==='confirm');
  document.getElementById('tab-dash').classList.toggle('on', v==='dashboard');
  document.getElementById('tab-history').classList.toggle('on', v==='history'||v==='historyDetail'||v==='overview');
  document.getElementById('tab-admin').classList.toggle('on', v==='admin');
  if(v==='dashboard') loadDashboard();
  if(v==='history') loadHistory();
  if(v==='admin') loadAdmin();
  if(v==='entry') checkDraft();
  if(v!=='entry') window.scrollTo(0,0);
}

// ==========================================================================
// Departments + init
// ==========================================================================
async function loadDepartments(){
  try{
    DEPARTMENTS=await api('/api/departments');
    document.getElementById('dept-btns').innerHTML = DEPARTMENTS.map(d=>'<button class="dept-btn" onclick="chooseDepartment('+d.id+')">'+esc(d.name)+(d.formRef?'<span class="dref">'+esc(d.formRef)+'</span>':'')+'</button>').join('') || '<div class="muted">No active departments.</div>';
    ['d-dept','hist-dept'].forEach(id=>{ const sel=document.getElementById(id); const all=(id==='hist-dept')?'<option value="">All</option>':''; sel.innerHTML=all+DEPARTMENTS.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join(''); });
    // Pre-load users (with IsAdmin) from the first department's form.
    if(DEPARTMENTS.length){ try{ const f=await api('/api/form/'+DEPARTMENTS[0].id); USERS=f.auditUsers||[]; populateUserPickers(); }catch(_){} }
  }catch(e){ document.getElementById('dept-btns').innerHTML='<div class="muted">Could not load departments: '+esc(e.message)+'</div>'; }
}
function populateUserPickers(){
  const auditorOpts='<option value="">— select —</option>'+USERS.map(u=>'<option value="'+esc(u.displayName)+'">'+esc(u.displayName)+'</option>').join('');
  document.getElementById('h-auditor').innerHTML=auditorOpts;
  const admOpts='<option value="">— none (dev) —</option>'+USERS.map(u=>'<option value="'+esc(u.email||u.displayName)+'"'+(u.isAdmin?'':'')+'>'+esc(u.displayName)+(u.isAdmin?' ★':'')+'</option>').join('');
  document.getElementById('adm-user').innerHTML=admOpts;
}
function changeDepartment(){ FORM=null; submissionId=null; document.getElementById('entry-main').classList.add('hidden'); document.getElementById('dept-choose').classList.remove('hidden'); document.getElementById('footbar').classList.add('hidden'); }
async function chooseDepartment(id){ await loadForm(id); }

// ==========================================================================
// Entry form
// ==========================================================================
async function loadForm(deptId, keepRows){
  try{
    FORM=await api('/api/form/'+deptId+'?date='+encodeURIComponent(val('h-date')||todayISO()));
    SEVLEVELS={}; FORM.severityLevels.forEach(l=>SEVLEVELS[l.severity]=l);
    MACHINES=FORM.machines; CHECKPOINTS=FORM.checkPoints; USERS=FORM.auditUsers||USERS;
    if(!keepRows){ rows={}; MACHINES.forEach(m=>rows[m.id]=emptyRow()); submissionId=null; }
    setVal('h-dept', FORM.department.name); document.getElementById('h-dept').dataset.id=FORM.department.id;
    document.getElementById('arealine-lbl').textContent = FORM.department.hasNdtCheck ? 'Area' : 'Area / Assembly Line';
    if(!FORM.department.hasNdtCheck && !val('h-arealine')) setVal('h-arealine','All');
    populateUserPickers();
    document.getElementById('total-count').textContent=MACHINES.length;
    renderLegend(); renderRows(); updateProgress();
    document.getElementById('dept-choose').classList.add('hidden');
    document.getElementById('entry-main').classList.remove('hidden');
    document.getElementById('footbar').classList.remove('hidden');
    draftDismissed=false; checkDraft(); checkServerDraft();
  }catch(e){ toast('Could not load form: '+e.message,true); }
}
function renderLegend(){
  document.getElementById('sev-legend').innerHTML = FORM.severityLevels.slice().sort((a,b)=>b.severity-a.severity).map(l=>
    '<div class="leg" style="border-left-color:'+esc(l.colourHex)+'"><div class="leg-hd"><span>'+esc(l.name.toUpperCase())+' — '+esc(l.auditName)+'</span><span class="leg-freq">'+esc(l.frequencyLabel)+' · '+l.checksPerWeek+'/wk</span></div><div class="leg-ins">'+esc(l.instruction)+'</div></div>').join('');
}
async function onDateShiftChange(){ if(FORM){ await loadForm(FORM.department.id, true); } }

function visibleMachines(){
  return MACHINES.filter(m=>{
    if(filter.sev!=='all'&&m.severity!==+filter.sev) return false;
    if(filter.loc==='Ph1'&&!m.location.includes('1')) return false;
    if(filter.loc==='Ph3'&&!m.location.includes('3')) return false;
    const r=rows[m.id];
    if(filter.flag==='todo'&&isAudited(r)) return false;
    if(filter.flag==='nok'&&!anyNok(r)) return false;
    return true;
  });
}
function segHtml(kind,id,value,size){
  return '<div class="seg seg-'+size+'">'+RESULTS.map(([v,lbl,hex,tip])=>'<button type="button" class="seg-btn'+(value===v?' on':'')+'" title="'+esc(tip)+'" style="'+(value===v?('background:'+hex):'')+'" onclick="setSeg(\''+kind+'\','+id+',\''+v+'\')">'+lbl+'</button>').join('')+'</div>';
}
function machineRowHtml(m,r){
  const lv=sevInfo(m.severity), open=expanded===m.id, state=rowState(r);
  const pill='<span class="pill" style="background:'+esc(lv.colourHex)+'">'+esc((lv.name||'').toUpperCase())+(lv.frequencyLabel?(' — '+esc(lv.frequencyLabel)):'')+'</span>';
  let tail='';
  if(open) tail=rowDetailHtml(m,r,lv);
  return '<div class="row state-'+state+'" id="row-'+m.id+'"><div class="spine" style="background:'+esc(lv.colourHex)+'"></div>'+
    '<div class="row-main"><div class="row-id">'+(m.sortOrder||'')+'</div>'+
    '<div class="row-name"><div class="nm">'+esc(m.displayName)+(m.specialMeasures?'<span class="xx">XX</span>':'')+(m.isFallback?'<span class="tag">default</span>':'')+'</div>'+
    '<div class="meta">'+pill+'<span class="pill grey">'+esc(m.location)+'</span></div></div>'+
    segHtml('result',m.id,r.result,'md')+'<button class="disc'+(open?' on':'')+'" onclick="toggleExpand('+m.id+')">'+(open?'&ndash;':'+')+'</button></div>'+tail+'</div>';
}
function fieldInput(id,key,label,value,cls){ return '<label class="field"><span>'+esc(label)+'</span><input class="'+(cls||'')+'" value="'+esc(value)+'" oninput="setField('+id+',\''+key+'\',this.value)"></label>'; }
function rowDetailHtml(m,r,lv){
  const needDev=anyNok(r);
  // sub-checks (NDT only when the department has it)
  const subs=['<div class="subfield"><span>Plans in place &amp; used</span>'+segHtml('plans',m.id,r.plans,'sm')+'</div>'];
  if(FORM.department.hasNdtCheck) subs.push('<div class="subfield"><span>Destructive / NDT in place &amp; used</span>'+segHtml('ndt',m.id,r.ndt,'sm')+'</div>');
  subs.push('<div class="subfield"><span>Area docs up to date</span>'+segHtml('areaDocs',m.id,r.areaDocs,'sm')+'</div>');
  // check-points for this machine's severity (cumulative)
  const cps=CHECKPOINTS.filter(c=>c.minSeverity<=m.severity);
  const cpHtml = cps.length ? '<div class="cp-list"><div class="ins-note">'+esc(lv.instruction)+'</div>'+cps.map(c=>
    '<div class="cp-row"><div class="cp-lbl">'+esc(c.label)+(c.conditional?'<em>(if applicable)</em>':'')+'</div>'+segHtml('cp:'+c.id,m.id,r.checkPoints[c.id]||'','sm')+'</div>').join('')+'</div>' : '';
  // failure fields
  const reasonSel = r.result==='NOT_AUDITED' ? '<label class="field"><span>Reason not audited <span class="req-flag">required</span></span><select onchange="setField('+m.id+',\'notAuditedReasonId\',this.value)"><option value="">— select —</option>'+FORM.notAuditedReasons.map(x=>'<option value="'+x.id+'"'+(String(r.notAuditedReasonId)===String(x.id)?' selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select></label>' : '';
  const custSel='<label class="field"><span>Customer</span><select onchange="setField('+m.id+',\'customerId\',this.value)"><option value="">—</option>'+FORM.customers.map(c=>'<option value="'+c.id+'"'+(String(r.customerId)===String(c.id)?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>';
  const actSel='<label class="field"><span>Action taken'+(r.result==='NOT_OK'?' <span class="req-flag">recommended</span>':'')+'</span><select onchange="setField('+m.id+',\'actionTypeId\',this.value)"><option value="">—</option>'+FORM.actionTypes.map(a=>'<option value="'+a.id+'"'+(String(r.actionTypeId)===String(a.id)?' selected':'')+'>'+esc(a.label)+'</option>').join('')+'</select></label>';
  const dev='<label class="field"><span>Deviation from standard'+(needDev?' <span class="req-flag">required</span>':'')+'</span><textarea rows="2" oninput="setField('+m.id+',\'deviation\',this.value)">'+esc(r.deviation)+'</textarea></label>';
  return '<div class="row-detail">'+
    '<div class="detail-grid">'+fieldInput(m.id,'partNo','Drawing / Part No.',r.partNo,'mono')+custSel+actSel+'</div>'+
    '<div class="sub-checks">'+subs.join('')+'</div>'+cpHtml+
    reasonSel+dev+
    '<label class="field"><span>Action detail (e.g. 4-D reference)</span><input value="'+esc(r.actionDetail)+'" oninput="setField('+m.id+',\'actionDetail\',this.value)"></label>'+
    photosHtml(m.id,r)+'</div>';
}
function photosHtml(id,r){
  const thumbs=(r.attachments||[]).map(a=>'<img class="thumb" src="/api/attachments/'+a.id+'" title="'+esc(a.fileName)+'">').join('');
  return '<div class="field"><span>Photos</span><div class="photos">'+thumbs+
    '<label class="addphoto">📷 Add photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhotoPick('+id+',this)"></label></div></div>';
}

function renderRows(){
  const list=visibleMachines(), host=document.getElementById('rows');
  host.innerHTML = list.length ? list.map(m=>machineRowHtml(m,rows[m.id])).join('') : '<div class="list-empty">No machines match this filter.</div>';
}
function setSeg(kind,id,v){
  const r=rows[id];
  if(kind.startsWith('cp:')){ const cid=kind.slice(3); r.checkPoints[cid]=(r.checkPoints[cid]===v)?'':v; }
  else { r[kind]=(r[kind]===v)?'':v; }
  renderRows(); updateProgress(); scheduleDraftSave();
}
function setField(id,key,v){ rows[id][key]=v; scheduleDraftSave(); }
function toggleExpand(id){ expanded=(expanded===id)?null:id; renderRows(); }
function markShownOK(){ visibleMachines().forEach(m=>{ if(!isAudited(rows[m.id])) rows[m.id].result='OK'; }); renderRows(); updateProgress(); scheduleDraftSave(); }
function updateProgress(){
  const total=MACHINES.length||1;
  const checked=MACHINES.filter(m=>isAudited(rows[m.id])).length;
  const fails=MACHINES.filter(m=>anyNok(rows[m.id])).length;
  document.getElementById('checked-count').textContent=checked;
  document.getElementById('pbar-fill').style.width=Math.round(checked/total*100)+'%';
  const fc=document.getElementById('fail-count'); fc.classList.toggle('hidden',fails===0); fc.textContent=fails+' fail'+(fails>1?'s':'');
  document.getElementById('save-btn').disabled=checked===0;
}
function resetEntry(){ MACHINES.forEach(m=>rows[m.id]=emptyRow()); expanded=null; submissionId=null; setVal('h-other',''); clearInlineError(); discardDraftKey(); renderRows(); updateProgress(); }
function getHeader(){ return { date:val('h-date'), shift:val('h-shift'), auditor:val('h-auditor'), areaLine:val('h-arealine') }; }

function validateRows(){
  const bad=[];
  MACHINES.forEach(m=>{ const r=rows[m.id]; if(!isAudited(r)) return;
    if(anyNok(r) && !(''+r.deviation).trim()) bad.push(m.id);
    if(r.result==='NOT_AUDITED' && !r.notAuditedReasonId) bad.push(m.id);
  });
  return [...new Set(bad)];
}
function buildResults(){
  return MACHINES.filter(m=>isAudited(rows[m.id])).map(m=>{ const r=rows[m.id];
    return { auditItemId:m.id, result:r.result, plansResult:r.plans||null, ndtResult:(FORM.department.hasNdtCheck?(r.ndt||null):null), areaDocsResult:r.areaDocs||null,
      notAuditedReasonId:r.result==='NOT_AUDITED'?(+r.notAuditedReasonId||null):null, partNo:r.partNo||null, deviation:r.deviation||null,
      customerId:+r.customerId||null, actionTypeId:+r.actionTypeId||null, actionDetail:r.actionDetail||null,
      checkPoints:Object.entries(r.checkPoints||{}).filter(([k,v])=>v).map(([k,v])=>({checkPointId:+k,answer:v})) };
  });
}
async function saveAudit(complete){
  clearInlineError();
  document.querySelectorAll('.row.invalid').forEach(el=>el.classList.remove('invalid'));
  const bad=validateRows();
  if(bad.length){ bad.forEach(id=>{const el=document.getElementById('row-'+id); if(el)el.classList.add('invalid');});
    if(expanded===null){ expanded=bad[0]; renderRows(); bad.forEach(id=>{const el=document.getElementById('row-'+id); if(el)el.classList.add('invalid');}); }
    showInlineError(bad.length+' row(s) need a deviation (for a Not OK) or a reason (for Not Audited).'); return; }
  const h=getHeader();
  if(!h.auditor){ showInlineError('Choose the auditor first — nothing was saved.'); return; }
  const results=buildResults();
  if(!results.length){ showInlineError('Check at least one machine first — nothing was saved.'); return; }
  const payload={ departmentId:+document.getElementById('h-dept').dataset.id, auditDate:h.date||todayISO(), shift:h.shift, auditor:h.auditor, areaLine:h.areaLine||null, otherNotes:val('h-other').trim()||null, isComplete:complete, results };
  const btn=document.getElementById('save-btn'); btn.disabled=true;
  try{
    const res = submissionId ? await api('/api/submissions/'+submissionId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
                             : await api('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    submissionId=res.id;
    (res.results||[]).forEach(rm=>{ if(rows[rm.auditItemId]) rows[rm.auditItemId].resultId=rm.resultId; });
    if(complete){ discardDraftKey();
      const checked=results.length, fails=MACHINES.filter(m=>anyNok(rows[m.id])).length;
      showConfirm({ id:res.id, dept:FORM.department.name, date:payload.auditDate, shift:payload.shift, auditor:payload.auditor, checked, fails });
    } else { toast('Draft saved — you can resume this shift later'); btn.disabled=false; }
  }catch(e){ showInlineError('Couldn’t save — '+e.message+'. Your entries are still here, try again.'); btn.disabled=false; }
}
function showInlineError(msg){ const el=document.getElementById('entry-error'); el.textContent=msg; el.classList.remove('hidden'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
function clearInlineError(){ document.getElementById('entry-error').classList.add('hidden'); }

// Photos — ensure the row is persisted (draft-save) so we have a resultId, then upload.
async function onPhotoPick(id, input){
  const file=input.files&&input.files[0]; if(!file) return;
  try{
    if(!rows[id].resultId){ if(!isAudited(rows[id])){ toast('Pick a result for this machine first',true); input.value=''; return; }
      await saveAudit(false); }
    const rid=rows[id].resultId; if(!rid){ toast('Save the row first',true); input.value=''; return; }
    const fd=new FormData(); fd.append('file',file);
    const att=await api('/api/results/'+rid+'/attachments',{method:'POST',body:fd});
    rows[id].attachments=rows[id].attachments||[]; rows[id].attachments.push(att);
    renderRows(); toast('Photo attached');
  }catch(e){ toast('Upload failed: '+e.message,true); }
  input.value='';
}

function showConfirm(info){
  lastSaved=info; const total=MACHINES.length||0;
  const failPill=info.fails?'<span class="c-pill bad">'+info.fails+' fail'+(info.fails>1?'s':'')+'</span>':'<span class="c-pill ok">No failures</span>';
  document.getElementById('confirm-body').innerHTML='<div class="confirm"><div class="tick">&check;</div><h2>Shift audit saved</h2>'+
    '<div class="c-meta">'+esc(info.dept)+' &middot; '+esc(info.date)+' &middot; '+esc(info.shift)+' &middot; '+esc(info.auditor)+'</div>'+
    '<div class="c-stats"><span class="c-pill ok">'+info.checked+'/'+total+' checked</span>'+failPill+'</div>'+
    '<div class="c-actions"><button class="primary" onclick="startNewAudit()">Start new audit</button><button class="ghost" onclick="openSubmission('+info.id+')">View this audit</button></div></div>';
  showView('confirm');
}
function startNewAudit(){ resetEntry(); showView('entry'); }

// ==========================================================================
// Draft backup (localStorage) + server-draft resume
// ==========================================================================
function scheduleDraftSave(){ draftDismissed=true; hideDraftBanner(); clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,500); }
function saveDraft(){ if(!FORM) return; try{ localStorage.setItem(DRAFT_KEY,JSON.stringify({departmentId:FORM.department.id,header:getHeader(),other:val('h-other'),rows,submissionId,savedAt:new Date().toISOString()})); }catch(_){}}
function checkDraft(){
  if(draftDismissed||!FORM) return;
  let raw; try{ raw=localStorage.getItem(DRAFT_KEY); }catch(_){ return; }
  if(!raw){ hideDraftBanner(); return; }
  let d; try{ d=JSON.parse(raw); }catch(_){ return; }
  if(d.departmentId!==FORM.department.id) return;
  pendingDraft=d;
  const label=d.savedAt?new Date(d.savedAt).toLocaleString():'earlier';
  const b=document.getElementById('draft-banner');
  b.innerHTML='<span>Restore unsaved audit from '+esc(label)+'?</span><span class="b-actions"><button onclick="restoreDraft()">Restore</button><button onclick="discardDraft()">Discard</button></span>';
  b.classList.remove('hidden');
}
function restoreDraft(){ if(!pendingDraft) return; const d=pendingDraft;
  if(d.header){ setVal('h-date',d.header.date); setVal('h-shift',d.header.shift); setVal('h-auditor',d.header.auditor); setVal('h-arealine',d.header.areaLine); }
  setVal('h-other',d.other||''); rows=d.rows||{}; submissionId=d.submissionId||null; MACHINES.forEach(m=>{ if(!rows[m.id]) rows[m.id]=emptyRow(); });
  draftDismissed=true; hideDraftBanner(); renderRows(); updateProgress();
}
function discardDraft(){ discardDraftKey(); draftDismissed=true; hideDraftBanner(); }
function discardDraftKey(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(_){} pendingDraft=null; draftDismissed=false; }
function hideDraftBanner(){ document.getElementById('draft-banner').classList.add('hidden'); }

async function checkServerDraft(){
  if(!FORM) return;
  const b=document.getElementById('resume-banner'); b.classList.add('hidden');
  try{
    const d=await api('/api/submissions/draft?departmentId='+FORM.department.id+'&date='+encodeURIComponent(val('h-date'))+'&shift='+encodeURIComponent(val('h-shift')));
    if(!d) return;
    b.innerHTML='<span>An unfinished audit exists for this area / date / shift. Resume it?</span><span class="b-actions"><button onclick="resumeServerDraft('+d.id+')">Resume</button><button onclick="document.getElementById(\'resume-banner\').classList.add(\'hidden\')">Ignore</button></span>';
    b.classList.remove('hidden');
  }catch(_){}
}
async function resumeServerDraft(id){
  document.getElementById('resume-banner').classList.add('hidden');
  try{ const d=await api('/api/submissions/'+id); loadDetailIntoForm(d); toast('Resumed draft'); }catch(e){ toast('Could not resume: '+e.message,true); }
}
function loadDetailIntoForm(d){
  submissionId=d.id;
  setVal('h-date',d.auditDate); setVal('h-shift',d.shift); setVal('h-auditor',d.auditor); setVal('h-arealine',d.areaLine);
  MACHINES.forEach(m=>rows[m.id]=emptyRow());
  d.results.forEach(rr=>{ const r=rows[rr.auditItemId]; if(!r) return;
    r.result=rr.result||''; r.plans=rr.plansResult||''; r.ndt=rr.ndtResult||''; r.areaDocs=rr.areaDocsResult||'';
    r.notAuditedReasonId=''; r.partNo=rr.partNo||''; r.deviation=rr.deviation||''; r.customerId=rr.customerId||''; r.actionTypeId=rr.actionTypeId||''; r.actionDetail=rr.actionDetail||'';
    r.resultId=rr.resultId; r.attachments=rr.attachments||[]; r.checkPoints={}; (rr.checkPoints||[]).forEach(cp=>{ r.checkPoints[cp.checkPointId]=cp.answer; });
  });
  renderRows(); updateProgress();
}

let charts={}; function destroyChart(k){ if(charts[k]){ charts[k].destroy(); charts[k]=null; } }
let DASH_FAILURES=[], dashFilter=null;
async function loadDashboard(){
  const dept=val('d-dept'); if(!dept){ document.getElementById('dash-body').innerHTML='<div class="clean">No department.</div>'; return; }
  const week=weekStartingISO(val('d-week'));
  const q='?departmentId='+dept+'&weekStarting='+week;
  const body=document.getElementById('dash-body');
  try{
    const [summary,failures,cps,customers]=await Promise.all([ api('/api/dashboard/summary'+q), api('/api/dashboard/failures'+q), api('/api/dashboard/check-points'+q), api('/api/dashboard/by-customer'+q) ]);
    DASH_FAILURES=failures||[]; dashFilter=null;
    renderDashboard(summary,cps,customers);
  }catch(e){ body.innerHTML='<div class="card clean">Could not load the dashboard.<br>'+esc(e.message)+'</div>'; }
}
function renderDashboard(s,cps,customers){
  const body=document.getElementById('dash-body'); const cur=s.current, prev=s.previous;
  const rateDelta=cur.passRate-prev.passRate, failDelta=cur.failCount-prev.failCount;
  const kpis=[ ['Shifts logged',cur.shiftsLogged,'',''], ['Checks completed',cur.passCount+cur.failCount,'',''],
    ['Pass rate',cur.passRate+'%',cur.passRate>=90?'green':'red',(rateDelta>=0?'up':'down')+'|'+(rateDelta>=0?'+':'')+rateDelta.toFixed(1)+' pts vs last wk'],
    ['Open failures',cur.failCount,cur.failCount>0?'red':'green',(failDelta<=0?'up':'down')+'|'+(failDelta>0?'+':'')+failDelta+' vs last wk'] ];
  const compliance=(s.compliance||[]).map(c=>{ const lv=sevInfo(c.severity);
    return '<div class="comp-row"><div class="comp-name"><span class="dot" style="background:'+esc(lv.colourHex)+'"></span>'+esc(c.displayName)+'</div><div class="comp-target '+(c.underTarget?'under':'met')+'">'+c.actual+'/'+c.expected+'</div><div class="muted" style="font-size:12px">'+c.pass+' ok · '+c.fail+' fail'+(c.notAudited?' · '+c.notAudited+' n/a':'')+'</div></div>'; }).join('')||'<div class="clean">No checks recorded this week.</div>';
  body.innerHTML='<div class="kpi-row">'+kpis.map(([lbl,v,tone,delta])=>{ const d=delta?'<div class="kpi-delta '+delta.split('|')[0]+'">'+esc(delta.split('|')[1])+'</div>':''; return '<div class="kpi '+tone+'"><div class="kpi-val">'+v+'</div><div class="kpi-lbl">'+lbl+'</div>'+d+'</div>'; }).join('')+'</div>'+
    '<div class="dash-grid"><div style="display:flex;flex-direction:column;gap:14px">'+
      '<section class="card"><div class="card-hd"><h3>Compliance against target</h3><span class="hd-note">week of '+esc(s.weekStarting)+'</span></div>'+compliance+'</section>'+
      '<section class="card"><div class="card-hd"><h3>Failure board</h3><span class="hd-note" id="fb-note">severity 3 first</span></div><div id="failboard"></div></section>'+
    '</div><div class="side">'+
      '<section class="card"><div class="card-hd"><h3>Check-point failures</h3></div><div class="chart-wrap"><canvas id="cpChart"></canvas></div></section>'+
      '<section class="card"><div class="card-hd"><h3>Failure rate by customer</h3></div><div class="chart-wrap"><canvas id="custChart"></canvas></div></section>'+
      '<section class="card"><div class="card-hd"><h3>Pass rate by severity</h3></div>'+barBlock(s.passBySeverity.map(x=>[sevInfo(x.severity).name,x.rate,x.fail+'/'+x.total,sevInfo(x.severity).colourHex]))+'</section>'+
      '<section class="card"><div class="card-hd"><h3>Pass rate by location</h3></div>'+barBlock((s.passByLocation||[]).map(x=>[x.location,x.rate,x.pass+'/'+x.total,x.rate>=90?'#15803d':'#b91c1c']))+'</section>'+
    '</div></div>';
  renderFailBoard(); drawCpChart(cps||[]); drawCustChart(customers||[]);
}
function barBlock(items){ return items.map(([lbl,pct,sub,hex])=>'<div class="bar-row"><div class="bar-lbl">'+esc(lbl)+'<em>'+esc(sub)+'</em></div><div class="bar-track"><span style="width:'+(pct||0)+'%;background:'+esc(hex)+'"></span></div><div class="bar-val">'+(pct==null?'—':pct+'%')+'</div></div>').join('')||'<div class="clean">No data.</div>'; }
function renderFailBoard(){
  const host=document.getElementById('failboard'); let list=DASH_FAILURES;
  if(dashFilter) list=list.filter(dashFilter.fn);
  document.getElementById('fb-note').innerHTML=dashFilter?('filtered: '+esc(dashFilter.label)+' <button class="sm-btn" onclick="clearDashFilter()">clear</button>'):'severity 3 first';
  if(!list.length){ host.innerHTML='<div class="clean">No failures'+(dashFilter?' for this filter':' this week')+'.</div>'; return; }
  host.innerHTML='<div class="fail-list">'+list.map(f=>{ const lv=sevInfo(f.severity);
    const subs=[ f.plansResult==='NOT_OK'?'<span class="tag warn">Plans</span>':'', f.ndtResult==='NOT_OK'?'<span class="tag warn">NDT</span>':'', f.areaDocsResult==='NOT_OK'?'<span class="tag warn">Docs</span>':'' ].join('');
    const photo=f.attachmentCount>0?'<span class="tag">📷 '+f.attachmentCount+'</span>':'';
    return '<div class="fail"><div class="sev-tag" style="background:'+esc(lv.colourHex)+'">'+esc((lv.name||'').toUpperCase())+'</div><div class="fail-body"><div class="fail-top"><span class="fail-name">'+esc(f.machineName)+'</span><span class="fail-when">'+esc(f.auditDate)+' · '+esc(f.shift)+'</span></div>'+
      '<div class="fail-dev">'+esc(f.deviation||'(no deviation noted)')+'</div><div class="fail-tags">'+esc(f.location)+(f.partNo?' <span class="mono tag">'+esc(f.partNo)+'</span>':'')+(f.customer?'<span class="tag">'+esc(f.customer)+'</span>':'')+(f.actionTaken?'<span class="tag act">'+esc(f.actionTaken)+'</span>':'')+subs+photo+'</div></div></div>'; }).join('')+'</div>';
}
function clearDashFilter(){ dashFilter=null; renderFailBoard(); }
function drawCpChart(cps){
  destroyChart('cp'); if(!cps.length){ document.getElementById('cpChart').parentElement.innerHTML='<div class="clean">No check-point failures this week.</div>'; return; }
  const palette=['#b91c1c','#b45309','#2f6f9f','#15803d','#7c3aed','#64748b','#0891b2','#be185d'];
  charts.cp=new Chart(document.getElementById('cpChart'),{ type:'pie', data:{ labels:cps.map(c=>c.checkPointLabel), datasets:[{ data:cps.map(c=>c.failCount), backgroundColor:cps.map((_,i)=>palette[i%palette.length]) }] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false, plugins:{ legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}} } } });
}
function drawCustChart(custs){
  destroyChart('cust'); const w=custs.filter(c=>c.failCount>0); if(!w.length){ document.getElementById('custChart').parentElement.innerHTML='<div class="clean">No customer failures this week.</div>'; return; }
  charts.cust=new Chart(document.getElementById('custChart'),{ type:'bar', data:{ labels:w.map(c=>c.customer), datasets:[{ data:w.map(c=>c.failCount), backgroundColor:'#b91c1c' }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true,ticks:{precision:0}}},
      onClick:(e,els)=>{ if(els.length){ const cust=w[els[0].index].customer; dashFilter={label:cust,fn:f=>(f.customer||'')===cust}; renderFailBoard(); } } } });
}
function toggleTv(){ document.body.classList.toggle('tv'); }

function resultBadge(v){ const o=RESULTS.find(x=>x[0]===v); return o?'<span class="pill" style="background:'+o[2]+'">'+o[1]+'</span>':''; }
async function openSubmission(id){
  showView('historyDetail'); const host=document.getElementById('history-detail-body'); host.innerHTML='<div class="clean">Loading…</div>';
  try{
    const d=await api('/api/submissions/'+id);
    const fails=d.results.filter(r=>r.result==='NOT_OK'||r.plansResult==='NOT_OK'||r.ndtResult==='NOT_OK'||r.areaDocsResult==='NOT_OK').length;
    const rowsHtml=d.results.map(rr=>{ const lv=sevInfo(rr.severityAtAudit);
      const tags=[ rr.plansResult==='NOT_OK'?'<span class="tag warn">Plans</span>':'', rr.ndtResult==='NOT_OK'?'<span class="tag warn">NDT</span>':'', rr.areaDocsResult==='NOT_OK'?'<span class="tag warn">Docs</span>':'',
        rr.notAuditedReason?'<span class="tag">'+esc(rr.notAuditedReason)+'</span>':'', rr.partNo?'<span class="mono tag">'+esc(rr.partNo)+'</span>':'',
        rr.customer?'<span class="tag">'+esc(rr.customer)+'</span>':'', rr.actionTaken?'<span class="tag act">'+esc(rr.actionTaken)+'</span>':'', rr.actionDetail?'<span class="tag">'+esc(rr.actionDetail)+'</span>':'',
        ...(rr.checkPoints||[]).filter(c=>c.answer==='NOT_OK').map(c=>'<span class="tag warn">'+esc(c.label)+'</span>') ].filter(Boolean).join('');
      const photos=(rr.attachments||[]).map(a=>'<img class="thumb" src="/api/attachments/'+a.id+'">').join('');
      const dev=rr.deviation?'<div class="fail-dev">'+esc(rr.deviation)+'</div>':'';
      const detail=(tags||dev||photos)?'<div class="ro-detail">'+dev+(tags?'<div class="ro-tags">'+tags+'</div>':'')+(photos?'<div class="photos">'+photos+'</div>':'')+'</div>':'';
      return '<div class="row state-'+(rr.result==='NOT_OK'?'nok':'ok')+'"><div class="spine" style="background:'+esc(lv.colourHex)+'"></div><div class="row-main"><div class="row-name"><div class="nm">'+esc(rr.machineName)+'</div><div class="meta"><span class="pill" style="background:'+esc(lv.colourHex)+'">'+esc((lv.name||'').toUpperCase())+'</span><span class="pill grey">'+esc(rr.location)+'</span></div></div>'+resultBadge(rr.result)+'</div>'+detail+'</div>'; }).join('');
    const notes=d.otherNotes?'<section class="card other-card"><div class="field"><span>Other daily issues &amp; tasks</span><div class="readonly-val">'+esc(d.otherNotes)+'</div></div></section>':'';
    host.innerHTML='<button class="back-link" onclick="showView(\'history\')">&larr; Back to history</button><div class="detail-head"><h2>'+esc(d.auditDate)+' · '+esc(d.shift)+'</h2><div class="muted">'+esc(d.departmentName)+' · '+esc(d.auditor)+(d.areaLine?' · '+esc(d.areaLine):'')+' · week of '+esc(d.weekStarting)+'</div><div style="margin-left:auto">'+(d.isComplete?'':'<span class="badge-draft">DRAFT</span> ')+(fails?'<span class="c-pill bad">'+fails+' fail'+(fails>1?'s':'')+'</span>':'<span class="c-pill ok">No failures</span>')+'</div></div><section class="rows">'+rowsHtml+'</section>'+notes;
  }catch(e){ host.innerHTML='<button class="back-link" onclick="showView(\'history\')">&larr; Back</button><div class="clean">Could not load audit #'+id+'.<br>'+esc(e.message)+'</div>'; }
}

let SEV_REVIEW=[];
async function loadSeverityReview(){
  const host=document.getElementById('adm-sev-body'); const week=weekStartingISO(val('adm-sev-week')); setVal('adm-sev-week',week);
  let q='?weekStarting='+week; if(val('adm-sev-dept')) q+='&departmentId='+val('adm-sev-dept');
  host.innerHTML='<div class="clean">Loading…</div>';
  try{ const data=await adminApi('/api/admin/severities'+q); SEV_REVIEW=data.rows.map(r=>({...r,chosen:r.severity}));
    host.innerHTML=SEV_REVIEW.map((r,i)=>sevReviewRowHtml(r,i)).join('')||'<div class="clean">No machines.</div>';
  }catch(e){ host.innerHTML='<div class="clean">'+esc(e.message)+'</div>'; }
}
function sevReviewRowHtml(r,i){ const changed=r.chosen!==r.previousSeverity;
  return '<div class="adm-item"><div class="comp-name">'+(r.sortOrder||'')+'. '+esc(r.displayName)+' <span class="muted" style="font-size:11px">('+esc(r.location)+')</span>'+(changed?'<span class="changed">was '+(RAG[r.previousSeverity]||{}).name+'</span>':'')+(r.isFallback?'<span class="tag">default</span>':'')+'</div><div class="adm-sev-btns">'+[3,2,1].map(s=>'<button class="rag'+(r.chosen===s?' on':'')+'" style="'+(r.chosen===s?('background:'+RAG[s].hex):'')+'" onclick="setReviewSev('+i+','+s+')">'+RAG[s].name[0]+'</button>').join('')+'</div></div>'; }
function setReviewSev(i,s){ SEV_REVIEW[i].chosen=s; document.getElementById('adm-sev-body').children[i].outerHTML=sevReviewRowHtml(SEV_REVIEW[i],i); }
async function saveSeverityReview(){ if(!SEV_REVIEW.length){ toast('Load a week first',true); return; }
  const body={ weekStarting:weekStartingISO(val('adm-sev-week')), setBy:adminUser||null, assignments:SEV_REVIEW.map(r=>({auditItemId:r.auditItemId,severity:r.chosen})) };
  try{ await adminApi('/api/admin/severities','POST',body); toast('Severities saved'); loadSeverityReview(); }catch(e){ toast('Save failed: '+e.message,true); } }

const macDraft={};
function macEdit(id,key,v){ macDraft[id]=macDraft[id]||{}; macDraft[id][key]=v; saveMachine(id); }
async function saveMachine(id){ const m=MAC_LIST.find(x=>x.id===id); if(!m) return; const p=macDraft[id]||{};
  const body={ id:m.id, departmentId:m.departmentId, displayName:p.displayName??m.displayName, location:p.location??m.location, defaultSeverity:+(p.defaultSeverity??m.defaultSeverity), specialMeasures:p.specialMeasures??m.specialMeasures, sortOrder:m.sortOrder, isActive:m.isActive };
  try{ const u=await adminApi('/api/admin/audit-items/'+id,'PUT',body); Object.assign(m,u); toast('Saved'); }catch(e){ toast('Save failed: '+e.message,true); } }
async function macRetire(id,active){ const m=MAC_LIST.find(x=>x.id===id); if(!m) return;
  const body={ id:m.id, departmentId:m.departmentId, displayName:m.displayName, location:m.location, defaultSeverity:m.defaultSeverity, specialMeasures:m.specialMeasures, sortOrder:m.sortOrder, isActive:active };
  try{ const u=await adminApi('/api/admin/audit-items/'+id,'PUT',body); Object.assign(m,u); document.getElementById('mac-'+id).outerHTML=''; loadMachines(); }catch(e){ toast('Failed: '+e.message,true); } }
async function addMachine(){ const body={ departmentId:+val('nm-dept'), displayName:val('nm-name').trim(), location:val('nm-loc').trim()||'Ph1', defaultSeverity:+val('nm-sev'), specialMeasures:document.getElementById('nm-xx').checked, sortOrder:(MAC_LIST.length+1)*10, isActive:true };
  if(!body.displayName){ toast('Enter a name',true); return; } try{ await adminApi('/api/admin/audit-items','POST',body); toast('Machine added'); loadMachines(); }catch(e){ toast('Failed: '+e.message,true); } }

async function loadUsers(){
